name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devops-fastapi-project:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/devops-fastapi-project:${{ github.sha }}

      - name: Update Kubernetes Deployment
        uses: appleboy/k8s-set-image-action@v1.0.0
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}
          namespace: default
          resource: deployment/devops-fastapi-deployment
          container: fastapi-app
          image: ${{ secrets.DOCKER_USERNAME }}/devops-fastapi-project:${{ github.sha }}

      - name: Rollout status
        run: kubectl rollout status deployment/devops-fastapi-deployment
